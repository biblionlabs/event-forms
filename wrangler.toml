name = "event-forms"
workers_dev = true
main = "build/worker/shim.mjs"
compatibility_date = "2025-06-10"

[build]
command = "worker-build --release"

[placement]
mode = "smart"

[observability]
enabled = true

[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"
fallthrough = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "event-forms-db"
database_id = "local-dev"

# Environment variables (for local development)
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"
ENCRYPTION_KEY = "local-dev-32-byte-secret-key!!"
COOKIE_DOMAIN = ""

# Production environment - create with: wrangler d1 create event-forms-db
[env.production]
workers_dev = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "event-forms-db"
# Replace with actual database_id after running: wrangler d1 create event-forms-db
database_id = "YOUR_PRODUCTION_DATABASE_ID"

[env.production.vars]
ADMIN_USERNAME = "admin"
COOKIE_DOMAIN = ""
# Set these as secrets with:
# wrangler secret put ADMIN_PASSWORD --env production
# wrangler secret put ENCRYPTION_KEY --env production

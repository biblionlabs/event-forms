name = "event-forms"
compatibility_date = "2025-06-10"
pages_build_output_dir = "dist/"

[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "changeme123"
COOKIE_SECRET = "change-this-to-a-random-secret-key-at-least-32-chars"

[[d1_databases]]
binding = "DB"
database_name = "event-forms-db"
database_id = "local"

[[r2_buckets]]
binding = "R2"
bucket_name = "event-forms-uploads"

[durable_objects]
bindings = [
  { name = "STATS_DO", class_name = "StatsAggregator" }
]

[[migrations]]
tag = "v1"
new_classes = ["StatsAggregator"]

[observability]
enabled = true

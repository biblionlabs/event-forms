name = "event-forms"
workers_dev = true
main = "build/worker/shim.mjs"
compatibility_date = "2025-06-10"

[build]
command = "worker-build --release"

[placement]
mode = "smart"

[observability]
enabled = true

[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"
fallthrough = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "event-forms"
database_id = "f93785ad-fcec-4a71-aa1d-62361b2f9b27"

# Environment variables
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "change-me-in-production"
ENCRYPTION_KEY = "32-byte-secret-key-change-in-prod"
COOKIE_DOMAIN = ""

# Local development environment
[env.local]
workers_dev = true

[env.local.vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"
ENCRYPTION_KEY = "local-dev-32-byte-secret-key!!"
COOKIE_DOMAIN = ""

[[env.local.d1_databases]]
binding = "DB"
database_name = "event-forms-db"
database_id = "local-dev-db"

# Production environment (override with secrets)
[env.production.vars]
COOKIE_DOMAIN = ""

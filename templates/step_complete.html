<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: {{BG_COLOR}};
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 3rem 2rem;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 0.75rem;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: {{PRIMARY_COLOR}};
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        {{IMAGE}}
        <h1>{{TITLE}}</h1>
        <p>{{MESSAGE}}</p>
        <a href="/f/{{SLUG}}/{{NEXT_STEP}}" class="btn">Continuar</a>
    </div>
</body>
</html>
